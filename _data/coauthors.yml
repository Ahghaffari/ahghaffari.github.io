# Coauthor profile links for the publications page.
# Keyed by lowercased last name; each entry lists the first-name variants used
# in the bibliography and an optional profile URL. When a URL is present, the
# coauthor's name in the publication list becomes a clickable link.
#
# Example:
# "gilman":
#   - firstname: ["Ekaterina", "E."]
#     url: https://example.org/ekaterina-gilman
